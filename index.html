<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="The Seventh-day Adventist Hymnal — hymns and scripture readings 1–920 with music playback and projection, for church and home worship. English and Yorùbá, with Igbo and Hausa to come."
    />
    <!-- Share preview. Without these a pasted link showed nothing at all: no
         picture, no title, no description — which is most of why it looked
         untrustworthy in a WhatsApp group. og:image must be an absolute URL;
         relative paths are ignored by every scraper. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hymnal" />
    <meta property="og:title" content="Seventh-day Adventist Hymnal" />
    <meta
      property="og:description"
      content="All 920 — hymns, calls to worship, invocations, responsive readings and benedictions. English and Yorùbá, with recordings. Works offline, and free."
    />
    <meta property="og:url" content="https://sdah-hymnal.vercel.app/" />
    <meta property="og:image" content="https://sdah-hymnal.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hymnal — 920 hymns, readings and benedictions" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seventh-day Adventist Hymnal" />
    <meta
      name="twitter:description"
      content="All 920 — hymns, readings and benedictions. English and Yorùbá. Works offline, and free."
    />
    <meta name="twitter:image" content="https://sdah-hymnal.vercel.app/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <title>Hymnal — Seventh-day Adventist Hymns &amp; Readings</title>
    <script>
      // Theme before first paint.
      //
      // React sets `dark` and `data-accent` from effects, which run *after*
      // the browser has already painted. On a phone in dark mode that meant a
      // full-screen flash of light paper at every launch, right as the splash
      // came up. Same for the accent colour. Reading localStorage here costs
      // nothing and removes the flash entirely.
      //
      // Kept deliberately in sync with useLocalStorage's JSON encoding and the
      // 'sdah.theme' / 'sdah.accent' keys in App.tsx.
      ;(function () {
        try {
          var read = function (k) {
            var raw = localStorage.getItem(k)
            return raw === null ? null : JSON.parse(raw)
          }
          var theme = read('sdah.theme') || 'system'
          var accent = read('sdah.accent') || 'mono'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          if (accent !== 'mono') document.documentElement.dataset.accent = accent
        } catch (e) {
          /* private mode or storage disabled — the effects still catch up */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
