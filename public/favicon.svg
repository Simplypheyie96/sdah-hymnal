<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hymnal">
  <!-- The mark for tab-strip sizes: 16 and 32 pixels.
       favicon.svg carries the full drawing — two pages, a spine, ruled lines
       and a quaver. All of that turns to porridge at 16px, where the whole
       icon is smaller than a single letter of this comment. So here the ruled
       lines are gone, the book is scaled up to fill the frame, and the note is
       drawn heavier: three shapes instead of six, each big enough to survive.
       Keep the two files in step whenever the mark changes. -->
  <rect width="512" height="512" rx="104" fill="#17191b"/>

  <g transform="translate(256 268) scale(1.24) translate(-256 -271)">
    <!-- Two pages fanning from the spine. -->
    <g fill="#f2f3f3">
      <path d="M248 168c-40-28-96-38-148-27a8 8 0 0 0-6 8v190a8 8 0 0 0 10 8c46-10 96-2 134 22a8 8 0 0 0 10-7V168z"/>
      <path d="M264 168c40-28 96-38 148-27a8 8 0 0 1 6 8v190a8 8 0 0 1-10 8c-46-10-96-2-134 22a8 8 0 0 1-10-7V168z"/>
    </g>

    <!-- Spine, thicker than on the full mark so it still reads as a gap. -->
    <rect x="246" y="150" width="20" height="242" rx="10" fill="#17191b"/>

    <!-- A single quaver, enlarged and squared up. The stem is the only thin
         part left, so it is nearly twice its original width. -->
    <g fill="#17191b">
      <rect x="330" y="196" width="19" height="104" rx="9"/>
      <path d="M349 196c30 12 48 28 50 50 1 14-4 25-13 34 4-18-3-32-18-41-10-7-16-11-19-18v-25z"/>
      <ellipse cx="308" cy="302" rx="36" ry="27" transform="rotate(-19 308 302)"/>
    </g>
  </g>
</svg>
